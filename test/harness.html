<!doctype html>
<html>
<head><meta charset="utf-8"><title>7z-wasm OPFS extraction test harness</title></head>
<body>
<script type="module">
  window.runExtract = function runExtract(archiveBytes, destPath) {
    return new Promise((resolve, reject) => {
      const worker = new Worker('../worker/opfs-extractor.js', { type: 'module' });
      const events = [];
      worker.onmessage = (ev) => {
        const msg = ev.data;
        events.push(msg);
        if (msg.type === 'done') {
          worker.terminate();
          resolve(events);
        } else if (msg.type === 'error') {
          worker.terminate();
          reject(new Error(msg.message + (msg.stack ? '\n' + msg.stack : '')));
        }
      };
      worker.onerror = (err) => {
        worker.terminate();
        reject(new Error('worker error: ' + err.message));
      };
      const archive = archiveBytes.buffer.slice(archiveBytes.byteOffset, archiveBytes.byteOffset + archiveBytes.byteLength);
      worker.postMessage({ type: 'extract', archive, destPath }, [archive]);
    });
  };

  window.readOpfsFileAsHex = async function readOpfsFileAsHex(path) {
    const root = await navigator.storage.getDirectory();
    const parts = path.split('/').filter(Boolean);
    let dir = root;
    for (let i = 0; i < parts.length - 1; i++) {
      dir = await dir.getDirectoryHandle(parts[i]);
    }
    const fileHandle = await dir.getFileHandle(parts[parts.length - 1]);
    const file = await fileHandle.getFile();
    const buf = new Uint8Array(await file.arrayBuffer());
    return Array.from(buf).map((b) => b.toString(16).padStart(2, '0')).join('');
  };

  window.sha256Hex = async function sha256Hex(hex) {
    const bytes = new Uint8Array(hex.match(/.{1,2}/g).map((b) => parseInt(b, 16)));
    const digest = await crypto.subtle.digest('SHA-256', bytes);
    return Array.from(new Uint8Array(digest)).map((b) => b.toString(16).padStart(2, '0')).join('');
  };

  window.removeOpfsEntry = async function removeOpfsEntry(name) {
    const root = await navigator.storage.getDirectory();
    try {
      await root.removeEntry(name, { recursive: true });
    } catch {
      // Nothing to remove -- fine.
    }
  };

  window.__harnessReady = true;
</script>
</body>
</html>
