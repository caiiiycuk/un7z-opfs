name: CI

on:
  push:
    branches:
      - master
    tags:
      - 'v*'
  pull_request:
    branches:
      - master

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install dependencies
      run: npm install

    - name: Install Playwright Chromium
      run: npx playwright install --with-deps chromium

    # Runs against the committed dist/7zz.js + dist/7zz.wasm, not a fresh
    # emsdk build -- keeps CI fast. See the (manual/optional) build-verify
    # job below for checking the CMake build itself still works.
    - name: Run Playwright tests
      run: npm test

  build-verify:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install Emscripten SDK
      uses: mymindstorm/setup-emsdk@v14
      with:
        version: '6.0.5'

    - name: Configure and build via CMake
      run: |
        cmake -S . -B build
        cmake --build build

    - name: Verify build output exists
      run: |
        test -f build/dist/7zz.js
        test -f build/dist/7zz.wasm

  publish:
    runs-on: ubuntu-latest
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        registry-url: 'https://registry.npmjs.org'

    - name: Verify tag matches package.json version
      run: |
        TAG_VERSION="${GITHUB_REF_NAME#v}"
        PKG_VERSION="$(node -p "require('./package.json').version")"
        if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
          echo "Tag version ($TAG_VERSION) does not match package.json version ($PKG_VERSION)"
          exit 1
        fi

    - name: Publish to npm
      run: npm publish
      env:
        NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
